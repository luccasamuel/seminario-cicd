# CI - Integração Contínua
# 1. Roda os testes em todo push e pull request para a main
# 2. Se os testes passarem (e for push na main), gera a imagem Docker
#    com tag SemVer + short hash e envia para o Docker Hub

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Se chegar um push novo, cancela a execução anterior da mesma branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/seminario-cicd

jobs:
  test:
    name: Testes
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1

      - name: Instalar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

  build-push:
    name: Build e Push da imagem
    runs-on: ubuntu-24.04
    needs: test                      # só roda se os testes passarem
    if: github.event_name == 'push'  # PR só testa, não publica imagem
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1

      - name: Gerar tags (SemVer + short hash)
        id: versao
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION | Commit: $SHORT_SHA"

      - name: Login no Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build e Push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.versao.outputs.version }}
            GIT_COMMIT=${{ steps.versao.outputs.short_sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.versao.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.versao.outputs.version }}-${{ steps.versao.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max