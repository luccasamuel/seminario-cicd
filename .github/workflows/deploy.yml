# CD - Entrega Contínua
# Roda automaticamente quando o workflow "CI" termina com sucesso na main
# (ou seja: só faz deploy se os testes passaram e a imagem foi publicada).
#
# Também pode ser disparado à mão (aba Actions → Deploy → Run workflow):
#   - escolhendo o cliente
#   - opcionalmente informando uma tag antiga → ROLLBACK em um clique
#
# Ele entra no servidor via SSH e atualiza APENAS o container do cliente escolhido.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cliente:
        description: Cliente que vai receber o deploy
        type: choice
        options: [cliente-a]
        default: cliente-a
      tag:
        description: "Rollback: tag de uma versão anterior (ex.: 1.2.0-7d9e8a8). Deixe vazio para a versão atual da main."
        type: string
        required: false

permissions:
  contents: read

# Nunca roda dois deploys do mesmo cliente ao mesmo tempo
concurrency:
  group: deploy-${{ inputs.cliente || 'cliente-a' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-24.04
    # Só faz deploy se o CI passou (testes + build + push) e veio de um push
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment: producao
    env:
      CLIENTE: ${{ inputs.cliente || 'cliente-a' }}
    steps:
      - name: Baixar o código do commit que passou no CI
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Descobrir a tag da imagem (SemVer + short hash)
        id: versao
        env:
          TAG_ROLLBACK: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_ROLLBACK" ]; then
            if ! echo "$TAG_ROLLBACK" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$'; then
              echo "::error::Tag inválida. Use o formato 1.2.0-7d9e8a8"
              exit 1
            fi
            TAG="$TAG_ROLLBACK"
            TIPO="Rollback"
          else
            TAG="$(node -p "require('./package.json').version")-$(git rev-parse --short=7 HEAD)"
            TIPO="Deploy"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${TAG##*-}" >> "$GITHUB_OUTPUT"
          echo "tipo=$TIPO" >> "$GITHUB_OUTPUT"
          echo "$TIPO de $CLIENTE com a imagem $TAG"

      - name: Configurar a chave SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Atualizar o container do cliente no servidor
        id: remoto
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          TAG: ${{ steps.versao.outputs.tag }}
          SHORT_SHA: ${{ steps.versao.outputs.short_sha }}
        run: |
          ANTERIOR=$(ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "grep '^TAG=' /opt/seminario/clientes/$CLIENTE/.env | cut -d= -f2")
          echo "anterior=$ANTERIOR" >> "$GITHUB_OUTPUT"
          INICIO=$(date +%s)

          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "CLIENTE=$CLIENTE TAG=$TAG SHORT_SHA=$SHORT_SHA bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/seminario/clientes/$CLIENTE
          echo "Antes:  $(grep '^TAG=' .env)"
          sed -i "s/^TAG=.*/TAG=$TAG/" .env
          echo "Depois: $(grep '^TAG=' .env)"

          # Baixa a imagem e recria só o container deste cliente
          docker compose pull
          docker compose up -d

          # Confere se o container novo está respondendo com o commit certo
          for i in $(seq 1 20); do
            if docker compose exec -T app wget -qO- http://localhost:3000/ 2>/dev/null \
                | grep -q "\"commit\":\"$SHORT_SHA\""; then
              echo "OK: $CLIENTE rodando $TAG"
              docker image prune -f > /dev/null
              exit 0
            fi
            sleep 3
          done
          echo "ERRO: o container não respondeu com a versão esperada"
          docker compose logs --tail 30
          exit 1
          EOF

          echo "duracao=$(( $(date +%s) - INICIO ))s" >> "$GITHUB_OUTPUT"

      - name: Resumo
        if: always()
        env:
          TIPO: ${{ steps.versao.outputs.tipo }}
          TAG: ${{ steps.versao.outputs.tag }}
          ANTERIOR: ${{ steps.remoto.outputs.anterior }}
          DURACAO: ${{ steps.remoto.outputs.duracao }}
          STATUS: ${{ job.status }}
          SHA: ${{ steps.versao.outputs.short_sha }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
          IMAGEM: ${{ vars.DOCKERHUB_USERNAME }}/seminario-cicd
        run: |
          if [ "$STATUS" = "success" ]; then ICONE="✅"; else ICONE="❌"; fi
          {
            echo "## $ICONE ${TIPO:-Deploy} — $CLIENTE"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Cliente** | \`$CLIENTE\` |"
            echo "| **Versão anterior** | \`${ANTERIOR:-?}\` |"
            echo "| **Versão nova** | \`$TAG\` |"
            echo "| **Commit** | [\`$SHA\`]($REPO/commit/$SHA) |"
            echo "| **Imagem** | [\`$IMAGEM:$TAG\`](https://hub.docker.com/r/$IMAGEM/tags) |"
            echo "| **Tempo de deploy** | ${DURACAO:-—} |"
            echo "| **Status** | $STATUS |"
            echo ""
            echo "Para voltar à versão anterior: **Actions → Deploy → Run workflow**, tag \`${ANTERIOR:-?}\`."
          } >> "$GITHUB_STEP_SUMMARY"
